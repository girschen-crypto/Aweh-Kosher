name: TradeDesk read-only VALR safety checks
on:
  pull_request:
    paths:
      - 'netlify/functions/**'
      - 'trade-desk/**'
      - 'netlify/functions/tradedesk-passkeys.mjs'
      - 'netlify/functions/_shared/tradedesk-passkey-session.mjs'
      - 'trade-desk/tests/passkey-auth.test.mjs'
      - 'trade-desk/tests/passkey-flow.test.mjs'
      - 'trade-desk/tests/signal-dashboard.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'netlify.tradedesk.toml'
      - 'trade-desk/app/index.html'
      - 'trade-desk/app/tradedesk-valr-client.js'
      - 'trade-desk/app/sw.js'
      - 'trade-desk/tests/valr-balances.test.mjs'
      - 'trade-desk/tests/signal-engine.test.mjs'
      - 'netlify/functions/tradedesk-signals.mjs'
      - 'netlify/functions/tradedesk-signal-cycle.mjs'
      - 'netlify/functions/_shared/tradedesk-radar.mjs'
      - 'trade-desk/app/tradedesk-signals.js'
      - 'trade-desk/tests/futures-lab.test.cjs'
      - '.github/workflows/tradedesk-valr-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-no-live-trades:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verified server dependencies
        run: npm ci --no-audit --no-fund
      - name: Test VALR gateway and existing paper simulator
        run: |
          node --check trade-desk/app/tradedesk-valr-client.js
          node --check trade-desk/app/tradedesk-signals.js
          node --check netlify/functions/tradedesk-signal-cycle.mjs
          node --check netlify/functions/tradedesk-signals.mjs
          node --check netlify/functions/tradedesk-passkeys.mjs
          npm test
      - name: Refuse live broker transaction endpoints in signal collectors
        run: |
          if grep -Eq '/v1/(orders|withdraw|account/subaccount/transfer)' netlify/functions/tradedesk-signals.mjs netlify/functions/tradedesk-signal-cycle.mjs netlify/functions/_shared/tradedesk-radar.mjs; then
            echo 'Unexpected live broker transaction route in signal collector'
            exit 1
          fi
      - name: Refuse order endpoint logic in VALR gateway
        run: |
          if grep -Eq '/v1/(orders|withdraw|account/subaccount/transfer)' netlify/functions/tradedesk-valr-balances.mjs; then
            echo 'Unexpected transaction route in read-only gateway'
            exit 1
          fi
