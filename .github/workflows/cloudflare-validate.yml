name: Validate Easy Kosher SA Cloudflare Rebuild

on:
  push:
    branches: [cloudflare-rebuild]
  pull_request:
    branches: [main, cloudflare-rebuild]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify financial controls and build application
        run: |
          npm test
          npm run build

      - name: Bundle Cloudflare Worker
        run: npx esbuild@0.25.8 cloudflare/worker.ts --bundle --format=esm --platform=browser --outfile=/tmp/travel-aweh-worker.js

      - name: Validate D1 migration SQL
        run: cat migrations/*.sql | sqlite3 :memory:
